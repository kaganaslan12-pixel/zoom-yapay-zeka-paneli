<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom Katılım Paneli PRO</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background-color: #1e293b; width: 100%; max-width: 520px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { margin: 0; color: #38bdf8; font-size: 24px; }
        .clock { color: #94a3b8; font-size: 14px; margin-top: 6px; font-weight: 600; }
        
        .card { background-color: #334155; border-radius: 12px; padding: 14px 18px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .card-info h4 { margin: 0 0 4px 0; font-size: 16px; color: #f1f5f9; }
        .card-info p { margin: 0; font-size: 12px; color: #94a3b8; }
        .card-actions { display: flex; gap: 8px; align-items: center; }

        .btn { border: none; border-radius: 8px; padding: 8px 12px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 6px; color: white; }
        .btn-join { background-color: #2563eb; }
        .btn-join:hover { background-color: #1d4ed8; }
        .btn-edit { background-color: #475569; padding: 8px; }
        .btn-edit:hover { background-color: #64748b; }
        .btn-delete { background-color: #ef4444; padding: 8px; }
        .btn-delete:hover { background-color: #dc2626; }

        .add-box { background-color: #0f172a; border-radius: 12px; padding: 16px; margin-top: 20px; }
        .add-box h3 { margin: 0 0 12px 0; font-size: 15px; color: #38bdf8; }
        .input-group { display: flex; gap: 8px; margin-bottom: 8px; }
        input, select { width: 100%; background-color: #1e293b; border: 1px solid #475569; color: white; padding: 10px; border-radius: 8px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        .btn-add { background-color: #10b981; width: 100%; justify-content: center; padding: 10px; margin-top: 6px; }
        .btn-add:hover { background-color: #059669; }

        /* Modal / Düzenleme Alanı */
        .modal-bg { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; }
        .modal { background: #1e293b; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; }
        .modal h3 { margin-top: 0; color: #38bdf8; }
        .modal-footer { display: flex; gap: 8px; margin-top: 14px; justify-content: flex-end; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>🚀 Zoom Katılım Paneli</h2>
        <div class="clock" id="liveClock">00:00:00</div>
    </div>

    <div id="teacherList">
        <!-- Hocalar dinamik olarak yüklenecek -->
    </div>

    <div class="add-box">
        <h3><i class="fa-solid fa-plus"></i> Yeni Ders / Hoca Ekle</h3>
        <input type="text" id="newTitle" placeholder="Ders / Hoca Adı (Örn: Matematik)" style="margin-bottom:8px;">
        <div class="input-group">
            <input type="text" id="newMeetingId" placeholder="Toplantı ID">
            <input type="text" id="newPasscode" placeholder="Passcode (Şifre)">
        </div>
        <button class="btn btn-add" onclick="addTeacher()"><i class="fa-solid fa-floppy-disk"></i> Kaydet ve Ekle</button>
    </div>
</div>

<!-- Düzenleme ve Alarm Ayar Modalı -->
<div class="modal-bg" id="editModal">
    <div class="modal">
        <h3><i class="fa-solid fa-pen-to-square"></i> Ders / Alarm Ayarları</h3>
        <input type="hidden" id="editIndex">
        <label style="font-size: 12px; color: #94a3b8;">Ders / Hoca Adı</label>
        <input type="text" id="editTitle" style="margin-bottom: 10px;">
        
        <label style="font-size: 12px; color: #94a3b8;">Alarm Saati</label>
        <input type="time" id="editAlarmTime" style="margin-bottom: 10px;">

        <label style="font-size: 12px; color: #94a3b8;">Alarm Sesi Seçimi</label>
        <select id="editAlarmSound" style="margin-bottom: 10px;">
            <option value="digital">Digital Beep 🔔</option>
            <option value="classic">Klasik Zil ⏰</option>
            <option value="loud">Yüksek Sesli Siren 🚨</option>
            <option value="soft">Yumuşak Melodi 🎵</option>
        </select>

        <div class="modal-footer">
            <button class="btn btn-edit" onclick="closeModal()">İptal</button>
            <button class="btn btn-add" style="width:auto;" onclick="saveSettings()">Kaydet</button>
        </div>
    </div>
</div>

<script>
    let teachers = JSON.parse(localStorage.getItem('zoom_teachers')) || [
        { title: 'Kenanhoca', id: '3105310751', pass: '9872', alarmTime: '', sound: 'digital' },
        { title: 'Pınarhoca', id: '8225120609', pass: '9872', alarmTime: '', sound: 'classic' },
        { title: 'Berrak hoca', id: '8513937753', pass: '9872', alarmTime: '', sound: 'loud' }
    ];

    function updateClock() {
        const now = new Date();
        const timeStr = now.toLocaleTimeString('tr-TR');
        document.getElementById('liveClock').innerText = timeStr;
        checkAlarms(now.toTimeString().substring(0,5));
    }
    setInterval(updateClock, 1000);

    function renderList() {
        const listEl = document.getElementById('teacherList');
        listEl.innerHTML = '';
        teachers.forEach((t, index) => {
            listEl.innerHTML += `
                <div class="card">
                    <div class="card-info">
                        <h4>🧔 ${t.title}</h4>
                        <p>ID: ${t.id} | Şifre: ${t.pass} ${t.alarmTime ? ' | ⏰ ' + t.alarmTime : ''}</p>
                    </div>
                    <div class="card-actions">
                        <button class="btn btn-edit" title="Ayarla/Düzenle" onclick="openModal(${index})">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="btn btn-join" onclick="joinMeeting('${t.id}', '${t.pass}')">
                            <i class="fa-solid fa-video"></i> Katıl
                        </button>
                        <button class="btn btn-delete" title="Sil" onclick="deleteTeacher(${index})">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                </div>
            `;
        });
        localStorage.setItem('zoom_teachers', JSON.stringify(teachers));
    }

    function openModal(index) {
        document.getElementById('editIndex').value = index;
        document.getElementById('editTitle').value = teachers[index].title;
        document.getElementById('editAlarmTime').value = teachers[index].alarmTime || '';
        document.getElementById('editAlarmSound').value = teachers[index].sound || 'digital';
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    function saveSettings() {
        const idx = document.getElementById('editIndex').value;
        teachers[idx].title = document.getElementById('editTitle').value;
        teachers[idx].alarmTime = document.getElementById('editAlarmTime').value;
        teachers[idx].sound = document.getElementById('editAlarmSound').value;
        closeModal();
        renderList();
    }

    function addTeacher() {
        const title = document.getElementById('newTitle').value;
        const id = document.getElementById('newMeetingId').value;
        const pass = document.getElementById('newPasscode').value;
        if(title && id) {
            teachers.push({ title, id, pass, alarmTime: '', sound: 'digital' });
            renderList();
            document.getElementById('newTitle').value = '';
            document.getElementById('newMeetingId').value = '';
            document.getElementById('newPasscode').value = '';
        }
    }

    function deleteTeacher(index) {
        teachers.splice(index, 1);
        renderList();
    }

    function joinMeeting(id, pass) {
        fetch('/join', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ meeting_id: id, passcode: pass })
        });
    }

    // Alarm Kontrolü ve Ses Çalma
    let lastTriggered = '';
    function checkAlarms(currentTime) {
        teachers.forEach(t => {
            if (t.alarmTime && t.alarmTime === currentTime && lastTriggered !== currentTime) {
                lastTriggered = currentTime;
                playAlarmSound(t.sound);
                alert(`⏰ Ders Vakti: ${t.title} dersi başladı!`);
            }
        });
    }

    function playAlarmSound(soundType) {
        // Tarayıcı içi bip/ton üretici (Harici dosyaya ihtiyaç duymadan çalışır)
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if(soundType === 'digital') osc.frequency.value = 800;
        else if(soundType === 'classic') osc.frequency.value = 400;
        else if(soundType === 'loud') osc.frequency.value = 1200;
        else osc.frequency.value = 523.25; // Yumuşak Do notası

        osc.start();
        setTimeout(() => osc.stop(), 1500);
    }

    renderList();
</script>
</body>
</html>
